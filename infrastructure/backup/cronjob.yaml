apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  labels:
    app.kubernetes.io/name: mysql-backup
    app.kubernetes.io/part-of: devops-gitops-demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 180

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-backup
        app.kubernetes.io/part-of: devops-gitops-demo

    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
            app.kubernetes.io/part-of: devops-gitops-demo

        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: mysqldump
              image: docker.io/bitnamilegacy/mysql:9.4.0-debian-12-r1
              imagePullPolicy: IfNotPresent

              command:
                - /bin/bash
                - -ec

              args:
                - |
                  umask 077

                  CLIENT_CONFIG="/tmp/mysql-client.cnf"

                  trap 'rm -f "${CLIENT_CONFIG}"' EXIT

                  cat > "${CLIENT_CONFIG}" <<EOF_CLIENT
                  [client]
                  host=${MYSQL_HOST}
                  port=${MYSQL_PORT}
                  user=${MYSQL_USER}
                  password=${MYSQL_PASSWORD}
                  EOF_CLIENT

                  ready="false"

                  for attempt in $(seq 1 30); do
                    if /opt/bitnami/mysql/bin/mysqladmin \
                      --defaults-extra-file="${CLIENT_CONFIG}" \
                      ping \
                      --silent; then

                      ready="true"
                      break
                    fi

                    echo "MySQL is not ready, attempt ${attempt}/30"
                    sleep 5
                  done

                  test "${ready}" = "true"

                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backups/${MYSQL_DATABASE}-${timestamp}.sql"

                  echo "Creating backup: ${target}"

                  /opt/bitnami/mysql/bin/mysqldump \
                    --defaults-extra-file="${CLIENT_CONFIG}" \
                    --single-transaction \
                    --routines \
                    --triggers \
                    --events \
                    --no-tablespaces \
                    --set-gtid-purged=OFF \
                    "${MYSQL_DATABASE}" \
                    > "${target}"

                  test -s "${target}"

                  chmod 600 "${target}"

                  echo "Backup created successfully:"
                  ls -lh "${target}"

                  echo "Removing SQL backups older than seven days"

                  find /backups \
                    -type f \
                    -name '*.sql' \
                    -mtime +7 \
                    -delete

              env:
                - name: HOME
                  value: /tmp

                - name: MYSQL_HOST
                  value: mysql

                - name: MYSQL_PORT
                  value: "3306"

                - name: MYSQL_DATABASE
                  value: appdb

                - name: MYSQL_USER
                  value: root

                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-auth
                      key: mysql-root-password

              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL

              volumeMounts:
                - name: backups
                  mountPath: /backups

          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backups
