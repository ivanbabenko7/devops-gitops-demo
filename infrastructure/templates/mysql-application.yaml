{{- $repoURL := required "repoURL must be supplied by the Terraform root Application" .Values.repoURL }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.mysql.name | quote }}
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "0"

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  sources:
    - repoURL: {{ .Values.mysql.chartRepoURL | quote }}
      chart: {{ .Values.mysql.chart | quote }}
      targetRevision: {{ .Values.mysql.chartVersion | quote }}

      helm:
        releaseName: {{ .Values.mysql.releaseName | quote }}

        valueFiles:
          - {{ printf "$values/%s" .Values.mysql.valuesFile | quote }}

    - repoURL: {{ $repoURL | quote }}
      targetRevision: {{ .Values.targetRevision | quote }}
      ref: values

  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

    retry:
      limit: 5

      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
