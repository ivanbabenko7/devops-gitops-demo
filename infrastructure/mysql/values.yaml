global:
  security:
    allowInsecureImages: true

fullnameOverride: mysql

architecture: standalone

image:
  registry: docker.io
  repository: bitnamilegacy/mysql
  tag: 9.4.0-debian-12-r1
  pullPolicy: IfNotPresent

auth:
  existingSecret: mysql-auth
  database: appdb
  username: appuser
  usePasswordFiles: true

initdbScripts:
  01-schema.sh: |
    #!/usr/bin/env bash

    set -Eeuo pipefail

    client_config="/tmp/mysql-init-client.cnf"
    password_aux="${MYSQL_ROOT_PASSWORD:-}"

    if [[ -f "${MYSQL_ROOT_PASSWORD_FILE:-}" ]]; then
      password_aux="$(
        cat "${MYSQL_ROOT_PASSWORD_FILE}"
      )"
    fi

    umask 077

    trap 'rm -f "${client_config}"' EXIT

    cat > "${client_config}" <<EOF_CLIENT
    [client]
    protocol=TCP
    host=127.0.0.1
    port=3306
    user=root
    password=${password_aux}
    EOF_CLIENT

    /opt/bitnami/mysql/bin/mysql \
      --defaults-extra-file="${client_config}" <<'EOF_SQL'
    CREATE DATABASE IF NOT EXISTS appdb;

    USE appdb;

    CREATE TABLE IF NOT EXISTS visits (
      id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
      source VARCHAR(64) NOT NULL DEFAULT 'unknown',
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (id)
    );
    EOF_SQL

primary:
  persistence:
    enabled: true
    storageClass: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  pdb:
    create: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

metrics:
  enabled: false
