apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-stack.fullname" . }}-frontend
  labels:
    {{- include "demo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    {{- include "demo-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
