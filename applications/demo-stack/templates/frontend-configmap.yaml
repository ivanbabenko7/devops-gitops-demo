apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-stack.fullname" . }}-frontend-config
  labels:
    {{- include "demo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  config.js: |
    window.APP_CONFIG = {
      apiBase: {{ .Values.frontend.config.apiBase | quote }}
    };
