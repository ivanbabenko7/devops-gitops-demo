<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GitOps Visit Counter</title>

  <style>
    :root {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #172033;
      background: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(20, 33, 61, 0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: clamp(28px, 5vw, 44px);
    }

    .subtitle {
      margin-top: 0;
      color: #667085;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin: 28px 0;
    }

    .card {
      padding: 20px;
      border: 1px solid #dce3ec;
      border-radius: 14px;
      background: #f8fafc;
    }

    .card-label {
      color: #667085;
      font-size: 14px;
    }

    .card-value {
      display: block;
      margin-top: 6px;
      font-size: 24px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #record-button {
      color: white;
      background: #2563eb;
    }

    #refresh-button {
      color: #172033;
      background: #e2e8f0;
    }

    #status {
      min-height: 24px;
      color: #475467;
    }

    #status.error {
      color: #b42318;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #e4e7ec;
    }

    th {
      color: #475467;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .empty {
      color: #667085;
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        padding: 22px;
      }

      th:nth-child(1),
      td:nth-child(1) {
        display: none;
      }
    }
  </style>

  <script src="/config.js"></script>
</head>

<body>
  <main>
    <h1>GitOps Visit Counter</h1>

    <p class="subtitle">
      Frontend → Backend → MySQL
    </p>

    <section class="summary">
      <div class="card">
        <span class="card-label">Stored visits</span>
        <strong id="visit-count" class="card-value">—</strong>
      </div>

      <div class="card">
        <span class="card-label">Served by backend pod</span>
        <strong id="served-by" class="card-value">—</strong>
      </div>
    </section>

    <section class="controls">
      <button id="record-button" type="button">
        Record a visit
      </button>

      <button id="refresh-button" type="button">
        Refresh
      </button>
    </section>

    <p id="status">Loading data...</p>

    <h2>Recent visits</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Source</th>
          <th>Created</th>
        </tr>
      </thead>

      <tbody id="visits-body">
        <tr>
          <td colspan="3" class="empty">Loading...</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    const apiBase = window.APP_CONFIG?.apiBase || "/api";

    const countElement = document.getElementById("visit-count");
    const servedByElement = document.getElementById("served-by");
    const statusElement = document.getElementById("status");
    const visitsBody = document.getElementById("visits-body");
    const recordButton = document.getElementById("record-button");
    const refreshButton = document.getElementById("refresh-button");

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }

    function setBusy(isBusy) {
      recordButton.disabled = isBusy;
      refreshButton.disabled = isBusy;
    }

    function formatDate(value) {
      if (!value) {
        return "—";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString();
    }

    function appendCell(row, value) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.appendChild(cell);
    }

    function renderVisits(data) {
      countElement.textContent = data.count ?? 0;
      servedByElement.textContent = data.servedBy ?? "unknown";
      visitsBody.replaceChildren();

      const visits = Array.isArray(data.recent)
        ? data.recent
        : [];

      if (visits.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 3;
        cell.className = "empty";
        cell.textContent = "No visits recorded yet.";

        row.appendChild(cell);
        visitsBody.appendChild(row);
        return;
      }

      for (const visit of visits) {
        const row = document.createElement("tr");

        appendCell(row, String(visit.id ?? "—"));
        appendCell(row, String(visit.source ?? "—"));
        appendCell(row, formatDate(visit.created_at));

        visitsBody.appendChild(row);
      }
    }

    async function callApi(options = {}) {
      const response = await fetch(
        `${apiBase}/visits`,
        {
          headers: {
            "Content-Type": "application/json"
          },
          ...options
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error || `Request failed with status ${response.status}`
        );
      }

      return data;
    }

    async function refreshVisits() {
      setBusy(true);
      setStatus("Loading data...");

      try {
        const data = await callApi();

        renderVisits(data);
        setStatus("Frontend, backend and MySQL are connected.");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        setBusy(false);
      }
    }

    async function recordVisit() {
      setBusy(true);
      setStatus("Recording visit...");

      try {
        const data = await callApi({
          method: "POST",
          body: JSON.stringify({
            source: "frontend"
          })
        });

        renderVisits(data);
        setStatus("Visit recorded successfully.");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        setBusy(false);
      }
    }

    recordButton.addEventListener("click", recordVisit);
    refreshButton.addEventListener("click", refreshVisits);

    refreshVisits();
  </script>
</body>
</html>
